<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Виртуальный тур</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12100E;--ink-soft:rgba(18,16,14,.72);--fog:#EDE8E0;
        --fog-dim:rgba(237,232,224,.58);--moss:#3F6B4F;--brass:#C2A76A}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;
    font-family:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #pano{position:absolute;inset:0}
  .pnlm-load-box,.pnlm-about-msg{display:none!important}
  .pnlm-container{background:var(--ink)!important}

  .plate{position:absolute;top:18px;left:18px;z-index:5;pointer-events:none;
    padding:11px 16px 12px;border-radius:3px;background:var(--ink-soft);
    backdrop-filter:blur(14px);border-left:2px solid var(--brass)}
  .plate .eyebrow{margin:0;font-size:10px;font-weight:500;letter-spacing:.16em;
    text-transform:uppercase;color:var(--fog-dim)}
  .plate .room{margin:5px 0 0;font-size:19px;font-weight:600;letter-spacing:-.01em;color:var(--fog)}

  .tools{position:absolute;top:18px;right:18px;z-index:5;display:flex;gap:7px}
  .tools button{width:42px;height:42px;border:0;border-radius:3px;cursor:pointer;
    background:var(--ink-soft);backdrop-filter:blur(14px);color:var(--fog);
    display:grid;place-items:center;transition:background .18s}
  .tools button:hover{background:var(--moss)}
  .tools button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .tools button[aria-pressed="true"]{background:var(--moss)}
  .tools svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}

  .hs{position:relative;width:66px;height:66px;cursor:pointer;display:grid;place-items:center}
  .hs::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:rgba(237,232,224,.90);box-shadow:0 6px 22px rgba(0,0,0,.42);
    transition:transform .22s cubic-bezier(.34,1.4,.64,1),background .22s}
  .hs::after{content:"";position:relative;width:16px;height:16px;
    border-right:2.6px solid var(--ink);border-bottom:2.6px solid var(--ink);
    transform:rotate(-45deg) translate(-2px,-2px);transition:border-color .22s}
  .hs:hover::before{transform:scale(1.16);background:var(--moss)}
  .hs:hover::after{border-color:#fff}
  .hs-label{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);
    white-space:nowrap;padding:5px 11px;border-radius:3px;background:var(--ink-soft);
    backdrop-filter:blur(10px);color:var(--fog);font-size:12.5px;font-weight:500;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .hs:hover .hs-label{opacity:1}
  .hs.pulse::before{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  body.editing .hs{cursor:grab}
  body.editing .hs .hs-label{opacity:1}
  body.dragging .hs{cursor:grabbing}
  body.dragging .hs::before{background:var(--brass)}

  #sheet{position:absolute;inset:0;z-index:8;background:rgba(12,11,10,.94);
    backdrop-filter:blur(8px);padding:74px 26px 26px;overflow:auto;display:none}
  #sheet.open{display:block}
  #sheet h2{margin:0 0 18px;font-size:11px;font-weight:500;letter-spacing:.16em;
    text-transform:uppercase;color:var(--fog-dim)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .grid button{position:relative;border:0;padding:0;cursor:pointer;background:none;
    border-radius:3px;overflow:hidden;aspect-ratio:2/1;opacity:.72;transition:opacity .18s}
  .grid button:hover{opacity:1}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .grid span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;
    font-size:12.5px;font-weight:500;color:var(--fog);text-align:left;
    background:linear-gradient(to top,rgba(12,11,10,.94),transparent)}
  #closeSheet{position:absolute;top:18px;right:18px;width:42px;height:42px;border:0;
    border-radius:3px;background:rgba(237,232,224,.12);color:var(--fog);cursor:pointer;font-size:22px}

  #edit{position:absolute;left:18px;bottom:18px;z-index:9;width:340px;
    max-width:calc(100vw - 36px);max-height:calc(100vh - 130px);overflow:auto;
    background:#0C0B0A;border:1px solid rgba(194,167,106,.3);border-radius:4px;
    padding:14px;color:var(--fog);font-size:13px;display:none}
  #edit.on{display:block}
  #edit h3{margin:0 0 3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--brass);font-weight:600}
  #edit .sub{margin:0 0 11px;font-size:12px;line-height:1.45;color:var(--fog-dim)}
  .arrow-row{display:flex;align-items:center;gap:8px;padding:6px 0;
    border-bottom:1px solid rgba(237,232,224,.09);font-size:12.5px}
  .arrow-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arrow-row .co{color:var(--fog-dim);font-size:11px;font-family:ui-monospace,Menlo,monospace}
  .arrow-row .del{border:0;background:rgba(255,90,70,.18);color:#FF9B8A;width:24px;height:24px;
    border-radius:3px;cursor:pointer;line-height:1;flex:0 0 auto}
  #edit select,#edit textarea,#edit .btn{width:100%;font-family:inherit;font-size:13px}
  #edit select{padding:8px;background:#1A1815;color:var(--fog);
    border:1px solid rgba(237,232,224,.2);border-radius:3px;margin:11px 0 8px}
  #edit textarea{height:80px;background:#1A1815;color:var(--fog);
    border:1px solid rgba(237,232,224,.2);border-radius:3px;padding:8px;
    font-family:ui-monospace,Menlo,monospace;font-size:10.5px;margin-top:8px;resize:vertical}
  #edit .btn{padding:9px;border:0;border-radius:3px;background:var(--moss);color:#fff;
    cursor:pointer;font-weight:500;margin-bottom:6px;display:block}
  #edit .btn.ghost{background:rgba(237,232,224,.12);color:var(--fog)}
  #editHint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:7;
    padding:10px 18px;border-radius:3px;background:var(--ink-soft);color:var(--fog);
    font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s}
  #editHint.show{opacity:1}

  #splash{position:absolute;inset:0;z-index:10;display:grid;place-items:center;
    background:var(--ink);color:var(--fog-dim);font-size:13px;transition:opacity .5s}
  #splash.gone{opacity:0;pointer-events:none}

  @media (max-width:640px){
    .hs{width:56px;height:56px}
    .plate .room{font-size:16px}.plate{top:12px;left:12px}.tools{top:12px;right:12px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="pano"></div>

<div class="plate">
  <p class="eyebrow">Виртуальный тур</p>
  <p class="room" id="roomName">—</p>
</div>

<div class="tools">
  <button id="btnMenu" title="Все помещения" aria-label="Все помещения">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button id="btnSpin" aria-pressed="false" title="Автоповорот" aria-label="Автоповорот">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg></button>
  <button id="btnFull" title="На весь экран" aria-label="На весь экран">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="sheet"><button id="closeSheet" aria-label="Закрыть">&times;</button><div id="sheetBody"></div></div>
<div id="editHint"></div>

<div id="edit">
  <h3>Разметка переходов</h3>
  <p class="sub" id="editStatus">—</p>
  <div id="arrowList"></div>
  <select id="editTarget"><option value="">+ добавить стрелку: куда ведёт?</option></select>
  <button class="btn" id="editCopy">Скопировать разметку</button>
  <button class="btn ghost" id="editReset">Вернуть исходную разметку</button>
  <textarea id="editOut" readonly></textarea>
</div>

<div id="splash">Загружаем панораму…</div>

<script>
/* ══════ 1) ТОЧКИ ТУРА — правь title, меняется название ══════ */
const POINTS = [
  {id:"vhod",       title:"Вход в дом"},
  {id:"dvor",       title:"Двор и парковка"},
  {id:"dorozhka",   title:"Дорожка вдоль дома"},
  {id:"uchastok",   title:"Участок"},
  {id:"prihozhaya", title:"Прихожая"},
  {id:"holl1",      title:"Холл у входа"},
  {id:"holl2",      title:"Центральный холл"},
  {id:"gostinaya",  title:"Кухня-гостиная"},
  {id:"kab1",       title:"Кабинет с диваном"},
  {id:"kab2",       title:"Кабинет с панорамой"},
  {id:"kab3",       title:"Рабочая комната"},
  {id:"sanuzel1",   title:"Санузел с ванной"},
  {id:"sanuzel2",   title:"Санузел с душевой"},
  {id:"kotelnaya",  title:"Котельная"}
];

/* ══════ 2) ПЕРЕХОДЫ ══════ */
const BASE_LINKS = {"prihozhaya":[{"to":"dvor","pitch":-32.6,"yaw":-171.8},{"to":"holl1","pitch":-25.6,"yaw":1.3}],"holl1":[{"to":"gostinaya","pitch":-27.7,"yaw":8.5},{"to":"sanuzel1","pitch":-12.8,"yaw":94.2},{"to":"kab1","pitch":-26.9,"yaw":-107.7},{"to":"kab2","pitch":-9.9,"yaw":105.5},{"to":"prihozhaya","pitch":-28.5,"yaw":168.2},{"to":"kab3","pitch":-16.6,"yaw":65.9}],"kab1":[{"to":"sanuzel2","pitch":-14.1,"yaw":131},{"to":"holl1","pitch":-28.3,"yaw":4.7}],"kab3":[{"to":"holl2","pitch":-18.5,"yaw":2.4}],"gostinaya":[{"to":"holl2","pitch":-20.6,"yaw":143.2},{"to":"kotelnaya","pitch":-9.1,"yaw":-129.2}],"holl2":[{"to":"sanuzel1","pitch":-21,"yaw":-165.9},{"to":"kab1","pitch":-5.5,"yaw":-18.1},{"to":"gostinaya","pitch":-15.6,"yaw":23.3},{"to":"kab2","pitch":-10.6,"yaw":-120},{"to":"prihozhaya","pitch":-17.9,"yaw":-42.5},{"to":"kab3","pitch":-16.7,"yaw":127.6}],"kab2":[{"to":"holl2","pitch":-24.1,"yaw":-146}],"sanuzel2":[{"to":"kab3","pitch":-22.5,"yaw":-166.6}],"kotelnaya":[{"to":"gostinaya","pitch":-10.3,"yaw":150.4},{"to":"uchastok","pitch":-11.6,"yaw":25.7}],"vhod":[{"to":"prihozhaya","pitch":4.4,"yaw":-76.5},{"to":"uchastok","pitch":4.8,"yaw":-147.7},{"to":"dvor","pitch":-3.2,"yaw":-174.5}],"dvor":[{"to":"vhod","pitch":-4.5,"yaw":46.8},{"to":"uchastok","pitch":-8.2,"yaw":-1.8}],"dorozhka":[{"to":"uchastok","pitch":-8.4,"yaw":73},{"to":"vhod","pitch":-13.6,"yaw":-49.3}],"uchastok":[{"to":"dorozhka","pitch":-11.9,"yaw":-65.3},{"to":"dvor","pitch":-18.4,"yaw":53.9},{"to":"kotelnaya","pitch":-21.7,"yaw":26.1}],"sanuzel1":[{"to":"holl2","pitch":-13.5,"yaw":137.4}]};

/* ─────────────────────────────────────────── */
const EDIT = new URLSearchParams(location.search).has("edit");
const KEY  = "tourLinks.v1";
const byId = Object.fromEntries(POINTS.map(p => [p.id, p.title]));

let LINKS = JSON.parse(JSON.stringify(BASE_LINKS));
if (EDIT) {
  try { const s = localStorage.getItem(KEY); if (s) LINKS = JSON.parse(s); } catch(e){}
}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(LINKS)); } catch(e){} }

function tooltip(div, text){
  div.classList.add("hs");
  if (!EDIT) div.classList.add("pulse");
  const s = document.createElement("span");
  s.className = "hs-label"; s.textContent = text; div.appendChild(s);
}
function hotspotsFor(id){
  return (LINKS[id] || []).map((l, i) => ({
    id: id + "-" + i, pitch: l.pitch, yaw: l.yaw,
    type: EDIT ? "info" : "scene", sceneId: l.to,
    cssClass: "hs", createTooltipFunc: tooltip,
    createTooltipArgs: byId[l.to] || l.to,
    clickHandlerFunc: EDIT ? function(){} : undefined
  }));
}

const scenes = {};
POINTS.forEach(p => { scenes[p.id] = {
  type:"equirectangular", panorama:"pano/"+p.id+".jpg",
  hfov:100, minHfov:45, maxHfov:120, pitch:0, yaw:0, hotSpots: hotspotsFor(p.id) }; });

const viewer = pannellum.viewer("pano", {
  default:{ firstScene:POINTS[0].id, sceneFadeDuration:700, autoLoad:true,
            showControls:false, compass:false, friction:0.16,
            backgroundColor:[0.07,0.06,0.055] },
  scenes: scenes
});

let current = POINTS[0].id;
viewer.on("scenechange", id => { current = id; paintRoom(); if (EDIT) setTimeout(rebuild, 80); });
viewer.on("load", () => document.getElementById("splash").classList.add("gone"));
function paintRoom(){ document.getElementById("roomName").textContent = byId[current] || current; }
paintRoom();

/* ---------- меню ---------- */
const sheet = document.getElementById("sheet"), sb = document.getElementById("sheetBody");
const h2 = document.createElement("h2"); h2.textContent = "Все помещения"; sb.appendChild(h2);
const grid = document.createElement("div"); grid.className = "grid"; sb.appendChild(grid);
POINTS.forEach(p => {
  const b = document.createElement("button");
  b.innerHTML = '<img src="thumb/'+p.id+'.jpg" alt="" loading="lazy"><span>'+p.title+'</span>';
  b.onclick = () => { viewer.loadScene(p.id); sheet.classList.remove("open"); };
  grid.appendChild(b);
});
document.getElementById("btnMenu").onclick  = () => sheet.classList.add("open");
document.getElementById("closeSheet").onclick = () => sheet.classList.remove("open");
document.addEventListener("keydown", e => { if (e.key === "Escape") sheet.classList.remove("open"); });

const btnSpin = document.getElementById("btnSpin");
let spinning = false;
btnSpin.onclick = () => { spinning = !spinning;
  spinning ? viewer.startAutoRotate(-2) : viewer.stopAutoRotate();
  btnSpin.setAttribute("aria-pressed", String(spinning)); };
document.getElementById("btnFull").onclick = () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else document.exitFullscreen(); };

/* ══════════ РЕЖИМ РАЗМЕТКИ ══════════ */
function rebuild(){}
if (EDIT) {
  document.body.classList.add("editing");
  const panel = document.getElementById("edit"),
        target = document.getElementById("editTarget"),
        status = document.getElementById("editStatus"),
        list   = document.getElementById("arrowList"),
        out    = document.getElementById("editOut"),
        hint   = document.getElementById("editHint"),
        stage  = document.getElementById("pano");
  panel.classList.add("on");

  POINTS.forEach(p => { const o = document.createElement("option");
    o.value = p.id; o.textContent = p.title; target.appendChild(o); });

  function flash(m){ hint.textContent = m; hint.classList.add("show");
    clearTimeout(flash.t); flash.t = setTimeout(() => hint.classList.remove("show"), 1500); }

  rebuild = function(){
    const cfg = viewer.getConfig();
    (cfg.hotSpots || []).slice().forEach(h => { try{ viewer.removeHotSpot(h.id); }catch(e){} });
    hotspotsFor(current).forEach(h => viewer.addHotSpot(h));
    renderPanel();
  };

  function renderPanel(){
    const arr = LINKS[current] || [];
    status.textContent = "«" + byId[current] + "» — стрелок: " + arr.length +
                         ". Тяни стрелку мышкой, чтобы подвинуть.";
    list.innerHTML = "";
    arr.forEach((l, i) => {
      const row = document.createElement("div"); row.className = "arrow-row";
      row.innerHTML = '<span class="nm">→ ' + (byId[l.to]||l.to) + '</span>' +
                      '<span class="co">' + l.pitch.toFixed(1) + ' / ' + l.yaw.toFixed(1) + '</span>';
      const d = document.createElement("button");
      d.className = "del"; d.textContent = "×"; d.title = "Удалить";
      d.onclick = () => { LINKS[current].splice(i,1);
        if(!LINKS[current].length) delete LINKS[current]; persist(); rebuild(); };
      row.appendChild(d); list.appendChild(row);
    });
    out.value = JSON.stringify(LINKS);
  }

  /* --- перетаскивание --- */
  let drag = null;
  stage.addEventListener("mousedown", e => {
    const el = e.target.closest(".hs");
    if (!el) return;
    const hs = (viewer.getConfig().hotSpots || []).find(h => h.div === el || (h.div && h.div.contains(e.target)));
    if (!hs) return;
    const idx = parseInt(String(hs.id).split("-").pop(), 10);
    drag = { hs: hs, idx: idx };
    document.body.classList.add("dragging");
    e.stopPropagation(); e.preventDefault();
  }, true);

  window.addEventListener("mousemove", e => {
    if (!drag) return;
    const c = viewer.mouseEventToCoords(e);
    drag.hs.pitch = c[0]; drag.hs.yaw = c[1];
    viewer.setYaw(viewer.getYaw(), false);        // форсируем перерисовку
    e.preventDefault();
  });

  window.addEventListener("mouseup", () => {
    if (!drag) return;
    const rec = (LINKS[current] || [])[drag.idx];
    if (rec){ rec.pitch = +drag.hs.pitch.toFixed(1); rec.yaw = +drag.hs.yaw.toFixed(1); }
    drag = null; document.body.classList.remove("dragging");
    persist(); renderPanel();
  });

  /* --- добавление --- */
  stage.addEventListener("click", e => {
    if (e.target.closest(".hs")) return;
    const to = target.value;
    if (!to){ flash("Сначала выбери комнату в списке"); return; }
    if (to === current){ flash("Это та же комната"); return; }
    const c = viewer.mouseEventToCoords(e);
    (LINKS[current] = LINKS[current] || []).push(
      { to: to, pitch: +c[0].toFixed(1), yaw: +c[1].toFixed(1) });
    target.value = ""; persist(); rebuild(); flash("Стрелка → " + byId[to]);
  });

  document.getElementById("editCopy").onclick = () => {
    out.value = JSON.stringify(LINKS); out.select();
    if (navigator.clipboard) navigator.clipboard.writeText(out.value)
      .then(() => flash("Скопировано"), () => flash("Скопируй из поля вручную"));
    else flash("Скопируй из поля вручную");
  };
  document.getElementById("editReset").onclick = () => {
    if (!confirm("Вернуть разметку к той, что вшита в файл? Твои правки пропадут.")) return;
    LINKS = JSON.parse(JSON.stringify(BASE_LINKS)); persist(); rebuild(); flash("Возвращено");
  };

  setTimeout(rebuild, 500);
}
</script>
</body>
</html>
